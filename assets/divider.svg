<svg xmlns="http://www.w3.org/2000/svg" width="900" height="12" viewBox="0 0 900 12" role="img" aria-label="divider">
  <!-- Thin teal divider with a light pulse travelling across it -->
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd0bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fd0bf" stop-opacity="1"/>
      <stop offset="1" stop-color="#3fd0bf" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="5" width="900" height="2" rx="1" fill="#3fd0bf" opacity="0.25"/>
  <rect x="-180" y="4" width="180" height="4" rx="2" fill="url(#pulse)">
    <animate attributeName="x" values="-180;900" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="450" cy="6" r="3" fill="#3fd0bf">
    <animate attributeName="r" values="2.5;4;2.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal typing: whoami, Juch Guliquey, AI Engineer and Full-Stack Developer">
  <!-- Animated terminal header for the GitHub profile, matching the portfolio's dark teal theme -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd0bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fd0bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3fd0bf" stop-opacity="0"/>
    </linearGradient>
    <!-- One clip per line; each widens over time so the line appears to be typed -->
    <clipPath id="l1"><rect x="40" y="62" height="32" width="0"><animate attributeName="width" from="0" to="120" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="96" height="40" width="0"><animate attributeName="width" from="0" to="320" begin="1.1s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="138" height="30" width="0"><animate attributeName="width" from="0" to="420" begin="1.9s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="40" y="176" height="30" width="0"><animate attributeName="width" from="0" to="200" begin="2.9s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="40" y="206" height="30" width="0"><animate attributeName="width" from="0" to="760" begin="3.6s" dur="1.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="40" y="244" height="30" width="0"><animate attributeName="width" from="0" to="420" begin="5s" dur="0.8s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #3fd0bf; font-size: 17px; }
    .cmd { fill: #e6edf0; font-size: 17px; }
    .name { fill: #e6edf0; font-size: 30px; font-weight: 700; }
    .role { fill: #3fd0bf; font-size: 19px; }
    .muted { fill: #93a4ad; font-size: 16px; }
  </style>

  <!-- Window -->
  <rect x="1" y="1" width="898" height="298" rx="12" fill="#0a0e11" stroke="#23303a" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="38" rx="12" fill="#11171b"/>
  <rect x="1" y="26" width="898" height="13" fill="#11171b"/>
  <line x1="1" y1="39" x2="899" y2="39" stroke="#23303a" stroke-width="1"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="20" r="6" fill="#febc2e"/>
  <circle cx="66" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" class="mono" fill="#93a4ad" font-size="13">juch@portfolio: ~</text>

  <!-- Lines -->
  <g clip-path="url(#l1)"><text x="40" y="84" class="mono"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text></g>
  <g clip-path="url(#l2)"><text x="40" y="126" class="mono name">Juch Guliquey</text></g>
  <g clip-path="url(#l3)"><text x="40" y="160" class="mono role">AI Engineer | Full-Stack Developer</text></g>
  <g clip-path="url(#l4)"><text x="40" y="198" class="mono"><tspan class="prompt">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text></g>
  <g clip-path="url(#l5)"><text x="40" y="228" class="mono muted">LLM features in production · Gemini · Vertex AI · Genkit · RAG · evals</text></g>
  <g clip-path="url(#l6)"><text x="40" y="266" class="mono"><tspan class="prompt">$ </tspan><tspan class="cmd">./ship --measured --safe</tspan></text></g>

  <!-- Blinking cursor, shown once the last command is typed -->
  <rect x="292" y="251" width="10" height="19" fill="#3fd0bf" opacity="0">
    <set attributeName="opacity" to="1" begin="5.8s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="5.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Scan line sweeping under the title bar -->
  <rect x="1" y="38" width="220" height="2" fill="url(#glow)">
    <animate attributeName="x" values="-220;900" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
